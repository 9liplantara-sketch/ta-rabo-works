<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報検証（Preview API）— ta_rabo</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #111; color: #c8c8c8; font-family: 'Noto Sans JP', sans-serif;
      font-size: .95rem; padding: 2rem; line-height: 1.6;
    }
    .err { color: #f0a0a0; max-width: 36rem; }
  </style>
  <script src="assets/js/ta-rabo-preview-config.js"></script>
  <script src="assets/js/ta-rabo-api-config.js"></script>
  <script>
  (function () {
    try {
      window.TaRaboApiConfig.assertPreviewConfigured();
    } catch (e) {
      window.__TA_RABO_PREVIEW_BOOT_ERROR = e;
      try {
        sessionStorage.removeItem('ta_rabo_page_profile');
      } catch (_) {}
      return;
    }

    try {
      sessionStorage.setItem('ta_rabo_page_profile', 'preview');
    } catch (_) {}

    const params = new URLSearchParams(location.search);
    const out = new URLSearchParams();
    ['auth_code', 'auth_error'].forEach(function (k) {
      const v = params.get(k);
      if (v) out.set(k, v);
    });
    const q = out.toString();
    const hash = location.hash || '';
    location.replace('lab_manager.html' + (q ? '?' + q : '') + hash);
  })();
  </script>
</head>
<body>
  <p id="msg">検証用 API 設定を確認しています…</p>
  <script>
  (function () {
    const e = window.__TA_RABO_PREVIEW_BOOT_ERROR;
    if (!e) return;
    const el = document.getElementById('msg');
    el.className = 'err';
    el.innerHTML =
      '検証用 API への接続設定がありません（本番 API にはフォールバックしません）。<br><br>' +
      'assets/js/ta-rabo-preview-config.example.js をコピーして<br>' +
      '<code>assets/js/ta-rabo-preview-config.js</code> に完全一致の Preview URL を記入してください。<br><br>' +
      (e && e.message ? e.message : '');
  })();
  </script>
</body>
</html>
