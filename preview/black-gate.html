<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>黒い扉</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      outline: none;
    }
    #stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: pan-y;
    }
    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      color: #888;
      background: rgba(255, 255, 255, 0.92);
      z-index: 3;
    }
    #status[data-kind="error"] { color: #8a2f2f; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="stage" tabindex="0" role="application" aria-label="黒い扉">
    <div id="status" data-kind="loading">読み込み中…</div>
  </div>
  <script type="module" src="../assets/js/black-gate/main.js"></script>
</body>
</html>
