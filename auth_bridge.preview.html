<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン処理中（Preview）… — ta_rabo</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #000; color: #9a9a9a; font-family: 'Noto Sans JP', sans-serif;
      font-size: .9rem; letter-spacing: .06em;
    }
    .err { color: #f0a0a0; max-width: 32rem; text-align: center; line-height: 1.6; }
  </style>
  <script src="assets/js/ta-rabo-preview-config.js"></script>
  <script src="assets/js/ta-rabo-api-config.js"></script>
</head>
<body>
  <p id="msg">ログインを完了しています（Preview）…</p>
  <script>
  (function () {
    const ALLOWED = new Set(['lab_manager.preview.html']);
    const RETURN_KEY = 'ta_rabo_auth_return__preview';
    const params = new URLSearchParams(location.search);

    try {
      window.TaRaboApiConfig.assertPreviewConfigured();
    } catch (e) {
      try {
        sessionStorage.removeItem('ta_rabo_page_profile');
      } catch (_) {}
      const el = document.getElementById('msg');
      el.className = 'err';
      el.textContent =
        '検証用 API 設定が欠けているため認証コードを転送しません（本番へは接続しません）。 ' +
        (e && e.message ? e.message : '');
      return;
    }

    try {
      sessionStorage.setItem('ta_rabo_page_profile', 'preview');
    } catch (_) {}

    function readStored() {
      try {
        const a = localStorage.getItem(RETURN_KEY);
        if (a && ALLOWED.has(a)) return a;
      } catch (_) {}
      try {
        const b = sessionStorage.getItem(RETURN_KEY);
        if (b && ALLOWED.has(b)) return b;
      } catch (_) {}
      try {
        const m = document.cookie.match(/(?:^|;\s*)ta_rabo_auth_return__preview=([^;]+)/);
        if (m) {
          const c = decodeURIComponent(m[1]);
          if (ALLOWED.has(c)) return c;
        }
      } catch (_) {}
      return '';
    }

    function clearStored() {
      try { localStorage.removeItem(RETURN_KEY); } catch (_) {}
      try { sessionStorage.removeItem(RETURN_KEY); } catch (_) {}
      try {
        const path = location.pathname.includes('/ta-rabo-works') ? '/ta-rabo-works/' : '/';
        document.cookie = RETURN_KEY + '=; path=' + path + '; max-age=0; SameSite=Lax';
        document.cookie = RETURN_KEY + '=; path=/; max-age=0; SameSite=Lax';
      } catch (_) {}
    }

    const fromQuery = String(params.get('next') || '').trim();
    const next = ALLOWED.has(fromQuery) ? fromQuery : (readStored() || 'lab_manager.preview.html');
    clearStored();

    const out = new URLSearchParams();
    const code = params.get('auth_code');
    const err = params.get('auth_error');
    if (code) out.set('auth_code', code);
    if (err) out.set('auth_error', err);
    const q = out.toString();
    location.replace(q ? next + '?' + q : next);
  })();
  </script>
</body>
</html>
